# Root remains Desktop-only on loopback. The full CPA Relay listens separately
# on 127.0.0.1:8318 and authenticates this hop with CPA_RELAY_API_KEY.
host: "127.0.0.1"
port: 8317
debug: false

logging:
  # Application/debug logging is written to root.log. Debug controls the log
  # level independently from access and traffic capture.
  logging-to-file: true
  # Relative paths resolve against this YAML file. A frozen deployment should
  # use an absolute runtime path outside its checksummed artifact directory.
  directory: "logs/root"
  # One metadata-only JSON record for every HTTP request or WebSocket session.
  request-access-log: true
  # Exact stock request/response payload bytes. Relay bodies are never captured.
  stock-request-response-log: true
  # auto emits readable UTF-8 as payload_text in root.stock-traffic.v2 and
  # falls back to base64 for encoded, binary, or invalid UTF-8 bytes. Use
  # base64 to retain the original root.stock-traffic.v1-only contract.
  stock-payload-format: auto
  max-file-size-mb: 32
  max-backups: 15
  max-age-days: 7
  max-total-size-mb: 512
  compress: true

relay:
  base-url: "http://127.0.0.1:8318/v1"
  api-key-env: "CPA_RELAY_API_KEY"

routing:
  # "static" (default) treats the lists below as the complete routing surface;
  # a model absent from both is rejected. "auto" discovers the Relay half from
  # the Relay catalog and merges in the ChatGPT catalog, refreshed in the
  # background, and the lists below become optional pins:
  #   - a non-empty stock-models list is protected from Relay collisions
  #   - a non-empty relay-models list narrows the discovered Relay catalog
  #   - relay-model-providers overrides a model's discovered owned_by
  # Under "auto" any model Relay does not serve is forwarded to the official
  # arm, and the Relay catalog becomes part of Root's routing surface. See the
  # security notes in ROOT_PROXY.md before enabling it.
  discovery: "auto"
  # Use exact model identifiers. Under "static" the sets must be non-empty and
  # disjoint; under "auto" both may be omitted, though keeping stock-models
  # pinned gives a correct catalog before the first background merge lands.
  stock-models: []
  relay-models: []
  # Optional for ordinary turns, but required for compaction creation or
  # replay. Models in the same family may reuse provider-local state.
  relay-model-providers: []
  # Stock models whose turns are forced onto the ChatGPT "Fast" (priority)
  # service tier, so Desktop no longer has to select it per turn. List only
  # models whose catalog entry advertises the tier; the current stock family
  # does, but gpt-5.4-mini and gpt-5.3-codex-spark do not and would be
  # rejected upstream. Fast trades quota for latency ("1.5x speed, increased
  # usage") and is plan-gated, so an account without it sees upstream errors.
  # Relay models are never eligible. Compaction requests are excluded.
  fast-models:
    - "gpt-5.6-luna"
  # Models advertised to Desktop as multi-agent v2. A v2 parent (currently
  # gpt-5.6-sol and gpt-5.6-terra) will only accept a spawn_agent target whose
  # catalog entry reports v2, and refuses everything else with "Unknown model
  # ... Available models: gpt-5.6-sol, gpt-5.6-terra". Advertising v2 is what
  # makes gpt-5.6-luna — which ChatGPT reports as v1 — and the Relay half
  # delegable as subagents.
  #
  # This is not free: an advertised child becomes a full v2 participant that
  # receives the collaboration tools and can spawn its own subagents, rather
  # than a leaf worker. Leave both unset to keep the previous behaviour.
  multi-agent-v2-models:
    - "gpt-5.6-luna"
  # Relay half. Either a bool for the whole discovered catalog, or a list of
  # provider-qualified models. The prefix names the Relay provider whose
  # executor will carry the collaboration tools, which is what actually decides
  # whether the model can serve as a subagent; it is validated against
  # {xai, kimi, deepseek} at load, and only the first "/" delimits it, so a
  # vendor-qualified slug such as "xai/x-ai/grok-4.5" works.
  #
  #   multi-agent-v2-relay: true
  #   multi-agent-v2-relay: ["xai/grok-4.5", "deepseek/deepseek-v4-flash"]
  #
  # A Relay identifier in multi-agent-v2-models is rejected; use this key.
  multi-agent-v2-relay: true

websocket:
  # Production-safe default. The installed ChatGPT Desktop client interprets
  # HTTP 426 as a sticky switch to the HTTP/SSE Responses transport. Set this
  # to "first-message" only to opt into the experimental WebSocket bridge.
  mode: "http-fallback"
  max-message-bytes: 67108864
  # Caps sockets waiting for a first message or an upstream handshake. The
  # oldest unestablished route is replaced when the cap is reached.
  max-pending-routes: 64
  # Shared by WebSocket and HTTP routes. An absent Origin is accepted. Add only
  # exact origins observed from trusted Desktop clients; wildcards are rejected.
  allowed-origins: []

http:
  # Applied independently to the raw body and a zstd-decoded inspection copy.
  max-request-body-bytes: 67108864
